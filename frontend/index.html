<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>森33-3行旅 | 埔里包棟民宿</title>
    <meta name="description" content="南投埔里包棟民宿，每天只接一組客人，獨享整棟空間。低調奢華、溫暖自在的私人招待所。" />

    <!-- Preload hero image for fast LCP -->
    <link rel="preload" as="image" href="/hero.webp" fetchpriority="high">

    <!-- Google Fonts: Noto Serif TC (標題) + Klee One (手寫區) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
      /* 系統字體 fallback（萬一 Google Fonts 暫時未載入） */
      @font-face {
        font-family: 'SerifFallback';
        src: local('Songti TC'), local('PMingLiU'), local('Noto Serif');
      }

      body {
        background: linear-gradient(180deg, #FDF5E6 0%, #FDF7ED 50%, #FDF5E6 100%);
        color: #6B4226;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        font-family: 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* 標題 → Noto Serif TC（載入後），SerifFallback（載入前） */
      h1, h2, h3, h4, h5, h6,
      .font-serif, [class*="font-serif"] {
        font-family: 'Noto Serif TC', 'SerifFallback', serif !important;
      }

      /* 手寫區 → Klee One（載入後），SerifFallback（載入前） */
      .font-handwriting, [class*="font-handwriting"] {
        font-family: 'Klee One', 'SerifFallback', cursive !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
