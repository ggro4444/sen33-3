    <!-- Google Fonts: Noto Sans TC (300,400,500,700), Noto Serif TC (400,500,600,700), Klee One (400,600) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Preload hero image for fast LCP -->
    <link rel="preload" as="image" href="/hero.webp" fetchpriority="high">

    <!-- Tailwind CSS 由 Vite build-time 注入，無 CDN runtime -->

        <style>
      body {
        background: linear-gradient(180deg, #FDF5E6 0%, #FDF7ED 50%, #FDF5E6 100%);
        color: #6B4226; /* warm-text */
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      /* Hide scrollbar for cleaner look in galleries */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* === 強制字體回退 — 不依賴 Tailwind CDN runtime === */
      /* 確保即使在 JS 尚未執行或 Google Fonts 載入失敗時，字體仍正確顯示 */
      body, .font-sans, [class*="font-sans"] {
        font-family: 'Noto Sans TC', -apple-system, 'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', sans-serif;
      }
      .font-serif, [class*="font-serif"], h1, h2, h3, h4 {
        font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', 'Noto Serif', serif !important;
      }
      .font-handwriting, [class*="font-handwriting"] {
        font-family: 'Klee One', 'Songti TC', 'PingFang TC', cursive !important;
      }
    </style>
  </head>
