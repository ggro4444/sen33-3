<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>森33-3行旅 | 埔里包棟民宿</title>
    <meta name="description" content="南投埔里包棟民宿，每天只接一組客人，獨享整棟空間。低調奢華、溫暖自在的私人招待所。" />

    <!-- Preload hero image for fast LCP -->
    <link rel="preload" as="image" href="/hero.webp" fetchpriority="high">

    <style>
      /* === 系統字體綁定 — @font-face local() 直接對接系統，不走任何網路請求 === */
      @font-face {
        font-family: 'SerifSystem';
        src: local('Songti TC'), local('STSongti-TC'), local('PMingLiU'), local('Noto Serif');
      }
      @font-face {
        font-family: 'SansSystem';
        src: local('PingFang TC'), local('Microsoft JhengHei'), local('Heiti TC');
      }

      body {
        background: linear-gradient(180deg, #FDF5E6 0%, #FDF7ED 50%, #FDF5E6 100%);
        color: #6B4226;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        font-family: 'SansSystem', -apple-system, sans-serif;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* 所有標題 + .font-serif → 系統宋體 */
      h1, h2, h3, h4, h5, h6,
      .font-serif, [class*="font-serif"] {
        font-family: 'SerifSystem', serif !important;
      }

      /* .font-handwriting → 同宋體（無系統手寫體） */
      .font-handwriting, [class*="font-handwriting"] {
        font-family: 'SerifSystem', serif !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <!-- 🔴 診斷用 — 測試完會移除 -->
    <script>
      setTimeout(() => {
        const h1 = document.querySelector('h1');
        const testEl = document.createElement('div');
        testEl.style.cssText = 'font-family:"Songti TC";position:absolute;visibility:hidden';
        document.body.appendChild(testEl);
        const hasSongtiTC = getComputedStyle(testEl).fontFamily.includes('Songti');
        testEl.remove();

        const testEl2 = document.createElement('div');
        testEl2.style.cssText = 'font-family:SerifSystem;position:absolute;visibility:hidden';
        document.body.appendChild(testEl2);
        const serifSystemResolves = getComputedStyle(testEl2).fontFamily;
        testEl2.remove();

        const testEl3 = document.createElement('div');
        testEl3.style.cssText = 'font-family:ui-serif;position:absolute;visibility:hidden';
        document.body.appendChild(testEl3);
        const uiSerifResolves = getComputedStyle(testEl3).fontFamily;
        testEl3.remove();

        const info = h1 
          ? 'H1 computed: ' + getComputedStyle(h1).fontFamily
          : 'H1 not found';
        
        const banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#000;color:#0f0;font:12px monospace;padding:8px;white-space:pre-wrap;max-height:50vh;overflow:auto';
        banner.textContent = [
          '🔴 DIAGNOSTIC (load & screenshot this)',
          '',
          info,
          '',
          'Songti TC available? ' + (hasSongtiTC ? 'YES ✅' : 'NO ❌'),
          '',
          'SerifSystem resolves to: ' + serifSystemResolves,
          '',
          'ui-serif resolves to: ' + uiSerifResolves,
          '',
          'UA: ' + navigator.userAgent,
        ].join('\n');
        document.body.prepend(banner);
      }, 3000);
    </script>
  </body>
</html>
