<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>森33-3行旅 | 埔里包棟民宿</title>
    <meta name="description" content="南投埔里包棟民宿，每天只接一組客人，獨享整棟空間。低調奢華、溫暖自在的私人招待所。" />

    <!-- Preload hero image for fast LCP -->
    <link rel="preload" as="image" href="/hero.webp" fetchpriority="high">

    <!-- 全站系統字體 — 無外部依賴，永遠不會載入失敗 -->
    <style>
      body {
        background: linear-gradient(180deg, #FDF5E6 0%, #FDF7ED 50%, #FDF5E6 100%);
        color: #6B4226;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        /* 內文：系統無襯線體 */
        font-family: 'PingFang TC', 'Microsoft JhengHei', -apple-system, 'Heiti TC', sans-serif;
      }
      /* Hide scrollbar for cleaner look in galleries */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* 標題 / 裝飾文字：系統襯線體（宋體） */
      /* iOS: Songti TC → Android: Noto Serif → Windows: PMingLiU */
      h1, h2, h3, h4, h5, h6,
      .font-serif, [class*="font-serif"] {
        font-family: 'Songti TC', 'PMingLiU', 'Noto Serif', 'Noto Serif TC', serif !important;
      }

      /* 手寫風格 fallback → 系統襯線體 */
      .font-handwriting, [class*="font-handwriting"] {
        font-family: 'Songti TC', 'PMingLiU', 'Noto Serif', serif !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
